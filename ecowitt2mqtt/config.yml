---
# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Ecowitt2mqtt
image: "vdanjean-org/ecowitt2mqtt-addon-{arch}"
version: 2026.02.0
slug: ecowitt2mqtt
description: An addon for locally processing data from Ecowitt Personal Weather Stations
url: https://github.com/vdanjean-org/hassio-addons/tree/main/ecowitt2mqtt
arch:
  - aarch64
  - amd64
init: false
#map:
#  - share:rw
services:
  - mqtt: need
ports:
  "8000/tcp": 8000
ports_description:
  "8000/tcp": "The port the Ecowitt hardware will use to submit data to Home Assistant"
environment:
  HASSIO_ADDON: 'true'

options:
  output_unit_system: "imperial"
  input_unit_system: "imperial"
  hass_discovery_prefix: "homeassistant"
  hass_entity_id_prefix: ""
schema:
  output_unit_system: "match(imperial|metric)?"
  input_unit_system: "match(imperial|metric)?"
  mqtt_host: "str?"
  mqtt_port: "str?"
  mqtt_user: "str?"
  mqtt_pass: "str?"
  hass_discovery_prefix: "str?"
  hass_entity_id_prefix: "str?"
